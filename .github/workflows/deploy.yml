# Production deploy. GitHub Pages must use "GitHub Actions" as the source
# (Settings → Pages → Build and deployment). The artifact includes public/CNAME,
# so the custom domain embedded-consultants.com stays attached.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Hourly, off the hour, so a rebuild follows each 08:00 Europe/Belgrade
  # publish time even when GitHub starts scheduled runs late.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
